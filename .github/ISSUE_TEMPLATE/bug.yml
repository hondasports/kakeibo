name: 困っていること
description: 不具合や想定外の挙動を分かる範囲で報告する
title: ""
body:
  - type: markdown
    attributes:
      value: |
        何が起きているかを優先して書いてください。期待動作・影響範囲・完了条件はAgentのREFINE工程でrepositoryと証拠を調査して補完します。

  - type: textarea
    id: problem
    attributes:
      label: 発生していること
      description: 分かる範囲で問題を記載してください。
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 再現方法
      description: 分かれば最短の再現手順を記載してください。

  - type: input
    id: environment
    attributes:
      label: 発生環境
      description: DEV / PREVIEW / PROD、ブラウザ、端末など分かる範囲で記載してください。

  - type: textarea
    id: evidence
    attributes:
      label: ログ・スクリーンショット・補足
      description: 証拠や関連Issueがあれば添付してください。秘密情報は含めないでください。
