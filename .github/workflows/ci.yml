name: CI

on:
  push:
    # main は PR 経由のみ更新される。merge commit のツリーは PR の CI で検証済みのため、
    # main への push では再実行しない。
    branches: [preview]
  pull_request:
    branches: [main, preview]
  # main への push では自動実行しないが、チェック未実行のまま取り込まれた変更の
  # 再検証用に手動実行を残す。
  workflow_dispatch:

# workflow 単位の paths-ignore は使わない。.md だけの変更でも workflow を起動し、
# 先頭の CI scope ジョブで「.md 以外の変更があるか」を判定して各ジョブを skip する
# （e2e.yml の classify と同じ考え方。required checks では skip されたジョブは合格扱い）。
# .md のみの変更でも scripts/unit-related-map.json に対応づけのあるunit契約テストは
# Test ジョブが実行する（文書を入力にするテストをCIで担保するため）。
# 判定が失敗・できない場合は安全側に倒して Lint / Build / Test をすべて実行する。

jobs:
  scope:
    name: CI scope
    runs-on: ubuntu-latest
    outputs:
      code_changed: ${{ steps.scope.outputs.code_changed || steps.scope_dispatch.outputs.code_changed }}
      mapped_tests: ${{ steps.scope.outputs.mapped_tests || steps.scope_dispatch.outputs.mapped_tests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7

      - name: Classify change scope (pull_request / push)
        id: scope
        if: github.event_name != 'workflow_dispatch'
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          node scripts/ci-change-scope.mjs --base "$BASE" --head "$HEAD" --github-output "$GITHUB_OUTPUT"

      - name: Classify change scope (workflow_dispatch)
        id: scope_dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "code_changed=true" >> "$GITHUB_OUTPUT"
          echo "mapped_tests=" >> "$GITHUB_OUTPUT"
          echo "reason=workflow_dispatch" >> "$GITHUB_OUTPUT"
          echo "changed_count=0" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    # scope が失敗・キャンセルされた場合は安全側で必ず実行する（skip=合格扱いにしない）。
    # workflow 自体がキャンセルされたときは実行しない。
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.code_changed == 'true') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('mise.toml', 'pnpm-lock.yaml') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.code_changed == 'true') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('mise.toml', 'pnpm-lock.yaml') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Build
        # VITE_* 環境変数はランタイムチェックのみで、vite build 自体は未設定でも通る
        run: pnpm run build

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: scope
    # .md のみの変更でも unit-related-map に対応テストがあれば実行する。
    # Lint / Build と違い Test だけ条件を広げるのは、文書を入力にする
    # 契約テスト（skills.test.mjs 等）の実行経路を残すため。
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.code_changed == 'true' || needs.scope.outputs.mapped_tests != '') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('mise.toml', 'pnpm-lock.yaml') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Test and coverage
        # scope判定不能時は安全側で全量実行。code_changed=true も全量。
        if: ${{ needs.scope.result != 'success' || needs.scope.outputs.code_changed == 'true' }}
        run: pnpm run test:coverage

      - name: Mapped contract tests
        # .md のみの変更で map に対応テストがあるときだけ、該当テストだけを実行する。
        # --passWithNoTests は付けない: 収集0件を成功にすると文書契約テストが
        # 静かに抜けるため、対象が壊れている場合はこのstepを失敗させる。
        if: ${{ needs.scope.result == 'success' && needs.scope.outputs.code_changed != 'true' && needs.scope.outputs.mapped_tests != '' }}
        run: pnpm exec vitest run ${{ needs.scope.outputs.mapped_tests }}
