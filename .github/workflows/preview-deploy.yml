name: Preview Branch Deploy

on:
  push:
    branches: [preview]
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Repository ref to deploy to the fixed staging Convex deployment"
        required: true
        default: "preview"

permissions:
  contents: read

# 固定 staging を使う区間の直列化は、Deploy ジョブ側の concurrency で行う。
# workflow 全体にかけないのは、待機ジョブがグループ外でポーリングすることで、
# 待機中の preview push がリリース候補E2Eの pending を押し出さないようにするため。
# preview への push では E2E を 2 つの目的に分ける。
#   - local-e2e: マージ結果コミットの回帰検知。PR の e2e.yml と同じ匿名使い捨て backend
#     （scripts/start-ci-convex.mjs）で @public / @smoke を実行し、cloud の Convex を読まない。
#   - preview: 固定 staging の設定ミス検知。staging の Convex に対しては @staging の少数だけ実行する。
# staging の Database I/O は Free 枠を team 合算で消費するため、全件を staging へ流さない。
jobs:
  local-e2e:
    name: E2E on isolated backend (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    concurrency:
      # backend はジョブごとの使い捨てで staging を触らないため、固定 staging の直列化グループ
      # （preview-staging-deploy / preview-staging-wait）には入れない。同じ ref の古い run だけを
      # キャンセルする。
      group: preview-local-e2e-${{ matrix.name }}-${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.ref_name }}
      cancel-in-progress: true
    env:
      SOURCE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: public
            # `--` 以降の引数は playwright に位置引数フィルタとして飲まれるため
            # フラグは script 名の直後に付ける
            e2e_command: pnpm run e2e:public --project=chromium --workers=3
            timeout: 10
          - name: authenticated
            e2e_command: pnpm run e2e:smoke --project=chromium --grep-invert @public --workers=1
            timeout: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_REF }}

      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve E2E Clerk user identifier
        env:
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}
        run: node scripts/resolve-e2e-clerk-user-id.mjs

      - name: Resolve Convex version
        id: convex-version
        run: echo "version=$(node -p "require('convex/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Convex backend binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/convex
          key: convex-${{ steps.convex-version.outputs.version }}-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Playwright browsers (Chromium only)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium --with-deps

      - name: Install Playwright system dependencies (cache hit時)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Run E2E tests on isolated backend
        run: node scripts/start-ci-convex.mjs --run "${{ matrix.e2e_command }}" --timeout 180
        env:
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}
          E2E_CLERK_USER_PASSWORD: ${{ secrets.E2E_CLERK_USER_PASSWORD }}
          # authenticated smoke だけシステム管理系fixtureを有効化する。
          E2E_SYSTEM_ADMIN_MEMBERSHIP_FIXTURE: ${{ matrix.name == 'authenticated' }}
          E2E_SYSTEM_ADMIN_SEARCH_FIXTURE: ${{ matrix.name == 'authenticated' }}

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report-${{ github.run_id }}-${{ matrix.name }}
          path: |
            playwright-report/
            test-results/
          retention-days: 1

      - name: Report flaky tests
        if: always()
        continue-on-error: true
        run: node scripts/report-flaky-e2e.mjs >> "$GITHUB_STEP_SUMMARY"

  wait-for-staging-window:
    name: Wait for staging window
    runs-on: ubuntu-latest
    # 待機上限の根拠は scripts/wait-for-staging-window.mjs の --timeout-minutes
    # 既定値コメントを参照。job 側はそれより余裕を持たせる。
    timeout-minutes: 130
    permissions:
      contents: read
      actions: read
    concurrency:
      # Deploy グループとは別。最新の preview run だけが待機を続け、
      # 古い待機はキャンセルされる（preview 同士は常に最新を優先）。
      group: preview-staging-wait
      cancel-in-progress: true
    env:
      SOURCE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_REF }}

      - name: Wait while a release candidate window is active
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # --timeout-minutes の根拠: 最悪ケースで「実行中 preview デプロイ(40m) +
        # preflight(20m) + リリース候補E2E(40m)」≈ 100m。それを上回る 120m を上限とし、
        # 超えた場合はデプロイせず失敗する（staging を壊さない側に倒す）。
        run: node scripts/wait-for-staging-window.mjs --timeout-minutes 120 --poll-seconds 30

  preview:
    name: Deploy preview branch
    needs: wait-for-staging-window
    runs-on: ubuntu-latest
    environment: Preview
    concurrency:
      # 固定 staging を触る区間の直列化。実行中のデプロイや、待機中の
      # リリース候補E2Eをキャンセルしない。preview 同士は実行中1件+待機1件で、
      # 待機は最新の run に置き換わる（最新の preview を常に優先）。
      group: preview-staging-deploy
      cancel-in-progress: false
    timeout-minutes: 40
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      SOURCE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.ref_name }}
      PREVIEW_DOMAIN: preview.suzumemo.jp
    steps:
      - name: Validate Preview configuration
        env:
          E2E_CLEANUP_SECRET: ${{ secrets.E2E_CLEANUP_SECRET }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}
        run: |
          missing=()
          [ -n "$VERCEL_TOKEN" ] || missing+=("secrets.VERCEL_TOKEN")
          [ -n "$VERCEL_ORG_ID" ] || missing+=("vars.VERCEL_ORG_ID")
          [ -n "$VERCEL_PROJECT_ID" ] || missing+=("vars.VERCEL_PROJECT_ID")
          [ -n "$CONVEX_DEPLOY_KEY" ] || missing+=("secrets.CONVEX_DEPLOY_KEY")
          [ -n "$E2E_CLEANUP_SECRET" ] || missing+=("secrets.E2E_CLEANUP_SECRET")
          [ -n "$CLERK_PUBLISHABLE_KEY" ] || missing+=("secrets.CLERK_PUBLISHABLE_KEY")
          [ -n "$CLERK_SECRET_KEY" ] || missing+=("secrets.CLERK_SECRET_KEY")
          [ -n "$E2E_CLERK_USER_EMAIL" ] || missing+=("secrets.E2E_CLERK_USER_EMAIL")

          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::Missing required Preview configuration: %s\n' "${missing[*]}"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_REF }}

      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Test
        run: pnpm test --run

      - name: Resolve E2E Clerk user identifier
        env:
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}
        run: node scripts/resolve-e2e-clerk-user-id.mjs

      - name: Configure Preview Convex security environment
        env:
          E2E_CLEANUP_SECRET: ${{ secrets.E2E_CLEANUP_SECRET }}
        run: |
          pnpm exec convex env set APP_ENV development
          pnpm exec convex env set INVITATION_REDIRECT_ORIGINS "https://$PREVIEW_DOMAIN"
          pnpm exec convex env set RECEIPT_IMAGE_EXTRACTOR_MODE mock
          pnpm exec convex env set E2E_CLERK_USER_ID "$E2E_CLERK_USER_ID"
          pnpm exec convex env set E2E_CLEANUP_SECRET "$E2E_CLEANUP_SECRET"

      - name: Configure Preview Convex integration mode
        run: node scripts/ensure-line-integration-mode.mjs

      - name: Build Convex staging and Vercel output
        run: |
          pnpm exec convex deploy \
            --cmd-url-env-var-name VITE_CONVEX_URL \
            --message "preview branch deploy ${GITHUB_SHA}" \
            --cmd 'pnpm exec vercel build --yes --target=preview --token "$VERCEL_TOKEN"'

      - name: Deploy Vercel Preview
        id: vercel
        run: |
          deployment_url="$(pnpm exec vercel deploy --prebuilt --archive=tgz --target=preview --token "$VERCEL_TOKEN")"
          if [[ ! "$deployment_url" =~ ^https://[a-z0-9-]+\.vercel\.app$ ]]; then
            echo "::error::Unexpected Vercel deployment URL format."
            exit 1
          fi
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Assign fixed Preview domain
        env:
          VERCEL_DEPLOYMENT_URL: ${{ steps.vercel.outputs.url }}
        run: |
          if [[ ! "$VERCEL_DEPLOYMENT_URL" =~ ^https://[a-z0-9-]+\.vercel\.app$ ]]; then
            echo "::error::Unexpected Vercel deployment URL format."
            exit 1
          fi

          deployed_sha="$(git rev-parse HEAD)"
          latest_preview_sha="$(git ls-remote origin refs/heads/preview | awk '{print $1}')"
          if [ -z "$latest_preview_sha" ]; then
            echo "::error::Could not resolve the latest preview branch commit."
            exit 1
          fi

          if [ "$deployed_sha" != "$latest_preview_sha" ]; then
            echo "Skipping fixed Preview alias because a newer preview commit exists."
            exit 0
          fi

          pnpm exec vercel alias set \
            "$VERCEL_DEPLOYMENT_URL" \
            "$PREVIEW_DOMAIN" \
            --token "$VERCEL_TOKEN"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Playwright browsers (Chromium only)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium --with-deps

      - name: Install Playwright system dependencies (cache hit時)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Configure local Vite E2E
        env:
          VITE_CONVEX_SITE_URL: ${{ vars.VITE_CONVEX_SITE_URL }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
        run: |
          if [[ ! "$VITE_CONVEX_SITE_URL" =~ ^https://([a-z0-9-]+)\.convex\.site/?$ ]]; then
            echo "::error::VITE_CONVEX_SITE_URL must be an https://*.convex.site URL."
            exit 1
          fi
          VITE_CONVEX_URL="https://${BASH_REMATCH[1]}.convex.cloud"
          if [ -z "$VITE_CLERK_PUBLISHABLE_KEY" ]; then
            echo "::error::CLERK_PUBLISHABLE_KEY is not set."
            exit 1
          fi
          echo "VITE_CONVEX_URL=$VITE_CONVEX_URL" >> "$GITHUB_ENV"
          echo "VITE_CLERK_PUBLISHABLE_KEY=$VITE_CLERK_PUBLISHABLE_KEY" >> "$GITHUB_ENV"

      # staging への読み書きを増やさないよう @staging（認証・保存・設定保存）だけに絞る。
      # ロジックの回帰は local-e2e job が見るため、ここは staging 固有の接続・設定の確認に限る。
      - name: Run staging integration smoke E2E tests
        run: pnpm run e2e:staging -- --project=chromium
        env:
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}
          E2E_CLERK_USER_PASSWORD: ${{ secrets.E2E_CLERK_USER_PASSWORD }}
          VITE_CONVEX_SITE_URL: ${{ vars.VITE_CONVEX_SITE_URL }}
          E2E_CLEANUP_SECRET: ${{ secrets.E2E_CLEANUP_SECRET }}

      - name: Write summary
        env:
          VERCEL_DEPLOYMENT_URL: ${{ steps.vercel.outputs.url }}
        run: |
          {
            echo "## Preview branch deploy"
            echo
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Source ref | \`$SOURCE_REF\` |"
            echo "| Convex deployment | \`staging\` |"
            echo "| Vercel deployment URL | $VERCEL_DEPLOYMENT_URL |"
            echo "| Fixed Preview URL | https://$PREVIEW_DOMAIN |"
            echo
            echo "This deployment uses the fixed Convex staging deployment and Clerk Development instance."
          } >> "$GITHUB_STEP_SUMMARY"
