name: E2E

# 同一リポジトリの PR 作成・更新時に、CI 内の Vite dev server に対して実行する。
# 先に changed-path classification を行い、process-only変更ではE2E jobをskipする。
# fork PR と Dependabot PR には Actions Secrets が渡らないため、Secrets を使う E2E は実行しない。
# Preview URL 自体は E2E 対象にしない。Vercel 対象 E2E は main の release candidate だけで実行する。
#
# 必要な GitHub Actions Secrets（手動設定が必要）:
#   CLERK_PUBLISHABLE_KEY            — Clerk Dev instance の pk_test_...
#   CLERK_SECRET_KEY                 — Clerk Dev instance の sk_test_...
#   E2E_CLERK_USER_EMAIL             — テストユーザーのメールアドレス
#   E2E_CLERK_USER_PASSWORD          — テストユーザーのパスワード
#   DEV_VITE_CONVEX_SITE_URL         — Dev deployment の Convex HTTP URL
#   VITE_CONVEX_URL                  — Dev deployment の Convex WebSocket URL
#   DEV_E2E_CLEANUP_SECRET           — Dev deployment の E2E cleanup 認証シークレット
#   DEV_CONVEX_DEPLOY_KEY            — Dev deployment の deploy key（CI で E2E_CLEANUP_SECRET を同期）
#   E2E_CLERK_USER_ID                — CIジョブ内でE2E_CLERK_USER_EMAILから解決する値
#
# 詳細: docs/development-process.md「E2E 確認方針」
#       docs/environment-variables.md「GitHub Actions Secrets に保存する項目」
on:
  pull_request:
    branches:
      - main
      - preview
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

jobs:
  classify:
    name: Classify E2E relevance
    runs-on: ubuntu-latest
    outputs:
      runtime_relevant: ${{ steps.classify.outputs.runtime_relevant }}
      reason: ${{ steps.classify.outputs.reason }}
      changed_count: ${{ steps.classify.outputs.changed_count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # merge commit ではなく、PR で push された head commit の差分を分類する。
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/classify-e2e-relevance.mjs --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"

      - name: Publish classification summary
        env:
          RUNTIME_RELEVANT: ${{ steps.classify.outputs.runtime_relevant }}
          REASON: ${{ steps.classify.outputs.reason }}
          CHANGED_COUNT: ${{ steps.classify.outputs.changed_count }}
        run: |
          {
            echo "### E2E relevance"
            printf '%s\n' "- runtime_relevant: \`$RUNTIME_RELEVANT\`"
            printf '%s\n' "- reason: \`$REASON\`"
            printf '%s\n' "- changed_paths: \`$CHANGED_COUNT\`"
          } >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: E2E (Playwright / Chromium / ${{ matrix.name }})
    needs: classify
    # PR コードへ Secrets を渡すため、同一リポジトリの通常 PR に限定する。
    # Dependabot PR は GitHub の仕様で fork 相当として扱われ、Actions Secrets を利用できない。
    if: |
      needs.classify.outputs.runtime_relevant == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    concurrency:
      # authenticated は共有Dev DB・固定ユーザーをcleanupするため、PRをまたいで直列化する。
      # public は共有fixtureを変更しないため、同じPRの古い実行だけをキャンセルする。
      group: e2e-${{ matrix.name }}-${{ matrix.name == 'authenticated' && 'shared-dev' || github.event.pull_request.number }}
      # authenticated は共有Dev DBを使うため先行runをcancelせず、同じgroup内でqueueする。
      # public はPR単位のgroupなので、同一PRの古いrunだけをcancelする。
      queue: ${{ matrix.queue }}
      cancel-in-progress: ${{ matrix.cancel_in_progress }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: public
            e2e_command: pnpm run e2e:public -- --project=chromium --workers=3
            timeout: 10
            queue: single
            cancel_in_progress: true
          - name: authenticated
            e2e_command: pnpm run e2e:smoke -- --project=chromium --grep-invert @public --workers=1
            timeout: 20
            queue: max
            cancel_in_progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # merge commit ではなく、PR で push された head commit を検証する。
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve E2E Clerk user identifier
        env:
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}
        run: node scripts/resolve-e2e-clerk-user-id.mjs

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          # @playwright/test のバージョンが変わったときのみ再ダウンロード
          key: playwright-chromium-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Playwright browsers (Chromium only)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium --with-deps

      - name: Install Playwright system dependencies (cache hit時)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Sync E2E cleanup secret to dev deployment
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.DEV_CONVEX_DEPLOY_KEY }}
          E2E_CLEANUP_SECRET: ${{ secrets.DEV_E2E_CLEANUP_SECRET }}
        run: |
          if [ -z "$E2E_CLEANUP_SECRET" ]; then
            echo "::error::DEV_E2E_CLEANUP_SECRET is not set."
            exit 1
          fi
          if [ -z "$E2E_CLERK_USER_ID" ]; then
            echo "::error::E2E_CLERK_USER_ID is not set."
            exit 1
          fi
          if [ -z "$CONVEX_DEPLOY_KEY" ]; then
            echo "::error::DEV_CONVEX_DEPLOY_KEY is not set."
            exit 1
          fi
          pnpm exec convex env set APP_ENV development
          pnpm exec convex env set RECEIPT_IMAGE_EXTRACTOR_MODE mock
          node scripts/ensure-line-integration-mode.mjs
          pnpm exec convex env set E2E_CLERK_USER_ID "$E2E_CLERK_USER_ID"
          pnpm exec convex env set E2E_CLEANUP_SECRET "$E2E_CLEANUP_SECRET"

      - name: Configure local Vite E2E
        env:
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
        run: |
          if [[ ! "$VITE_CONVEX_URL" =~ ^https://[a-z0-9-]+\.convex\.cloud/?$ ]]; then
            echo "::error::VITE_CONVEX_URL must be an https://*.convex.cloud URL."
            exit 1
          fi
          VITE_CONVEX_URL="${VITE_CONVEX_URL%/}"
          if [ -z "$VITE_CLERK_PUBLISHABLE_KEY" ]; then
            echo "::error::CLERK_PUBLISHABLE_KEY is not set."
            exit 1
          fi
          echo "VITE_CONVEX_URL=$VITE_CONVEX_URL" >> "$GITHUB_ENV"
          echo "VITE_CLERK_PUBLISHABLE_KEY=$VITE_CLERK_PUBLISHABLE_KEY" >> "$GITHUB_ENV"

      - name: Run local smoke E2E tests
        run: ${{ matrix.e2e_command }}
        env:
          # Clerk Testing Token 取得用
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          # E2E テストユーザー認証情報（ログ出力禁止）
          E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}
          E2E_CLERK_USER_PASSWORD: ${{ secrets.E2E_CLERK_USER_PASSWORD }}
          # CI 内の Vite dev server が接続する Dev deployment の cleanup / seed 設定
          VITE_CONVEX_SITE_URL: ${{ secrets.DEV_VITE_CONVEX_SITE_URL }}
          E2E_CLEANUP_SECRET: ${{ secrets.DEV_E2E_CLEANUP_SECRET }}

      # 失敗時のみ artifact を保存（認証情報が含まれる可能性があるため短期保存）
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-${{ github.run_id }}-${{ matrix.name }}
          path: |
            playwright-report/
            test-results/
          # 1日で削除（認証情報が含まれる可能性があるため最短期間）
          retention-days: 1
