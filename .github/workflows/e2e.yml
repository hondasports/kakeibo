name: E2E

# 同一リポジトリの PR 作成・更新時に、CI 内の Vite dev server に対して実行する。
# 先に changed-path classification を行い、process-only変更ではE2E jobをskipする。
# fork PR と Dependabot PR には Actions Secrets が渡らないため、Secrets を使う E2E は実行しない。
# Preview URL 自体は E2E 対象にしない。Vercel 対象 E2E は main の release candidate だけで実行する。
#
# 必要な GitHub Actions Secrets（手動設定が必要）:
#   CLERK_PUBLISHABLE_KEY            — Clerk Dev instance の pk_test_...
#   CLERK_SECRET_KEY                 — Clerk Dev instance の sk_test_...
#   E2E_CLERK_USER_EMAIL             — テストユーザーのメールアドレス
#   E2E_CLERK_USER_PASSWORD          — テストユーザーのパスワード
#   E2E_CLERK_USER_ID                — CIジョブ内でE2E_CLERK_USER_EMAILから解決する値
#
# E2Eは PRの Convex関数を反映した PR/ジョブ専用の匿名使い捨て backend
# （CONVEX_AGENT_MODE=anonymous の local deployment）に対して実行する。
# 共有Dev deployment・共有Dev用のsecretsには接続しない（Issue #956）。
# backend の起動・env同期・終了は scripts/start-ci-convex.mjs が担う。
#
# 詳細: docs/development-process.md「E2E 確認方針」
#       docs/environment-variables.md「GitHub Actions Secrets に保存する項目」
on:
  pull_request:
    branches:
      - main
      - preview
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

jobs:
  classify:
    name: Classify E2E relevance
    runs-on: ubuntu-latest
    outputs:
      runtime_relevant: ${{ steps.classify.outputs.runtime_relevant }}
      reason: ${{ steps.classify.outputs.reason }}
      changed_count: ${{ steps.classify.outputs.changed_count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # merge commit ではなく、PR で push された head commit の差分を分類する。
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Classify changed paths
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/classify-e2e-relevance.mjs --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"

      - name: Publish classification summary
        env:
          RUNTIME_RELEVANT: ${{ steps.classify.outputs.runtime_relevant }}
          REASON: ${{ steps.classify.outputs.reason }}
          CHANGED_COUNT: ${{ steps.classify.outputs.changed_count }}
        run: |
          {
            echo "### E2E relevance"
            printf '%s\n' "- runtime_relevant: \`$RUNTIME_RELEVANT\`"
            printf '%s\n' "- reason: \`$REASON\`"
            printf '%s\n' "- changed_paths: \`$CHANGED_COUNT\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # verify:prepush（ローカル）と同じ選定結果をCIのsummaryへ出し、
      # ローカルで実行されたspecと比較できるようにする（CI自体は従来どおり実行）。
      # ただし「同じ選定」は preview 向け PR でのみ成立する。verify:prepush は
      # origin/preview を既定の base にするため、他ブランチ向け PR では
      # ここに出る選定とローカル結果が一致し得ない（--base で明示すれば一致）。
      - name: Report verify:prepush spec selection
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          {
            echo "### verify:prepush spec selection"
            echo '```json'
            node scripts/select-e2e-specs.mjs --base "$BASE_SHA" --head "$HEAD_SHA" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const r=JSON.parse(s);console.log(JSON.stringify({specs:r.specs,unmapped:r.unmapped,fallback:r.fallback},null,2))})"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: E2E (Playwright / Chromium / ${{ matrix.name }})
    needs: classify
    # PR コードへ Secrets を渡すため、同一リポジトリの通常 PR に限定する。
    # Dependabot PR は GitHub の仕様で fork 相当として扱われ、Actions Secrets を利用できない。
    # backend はジョブ専用の使い捨てのため draft PR でも実行する
    # （レビュー修正のたびに最新 HEAD の関数で E2E が走る）。
    if: |
      needs.classify.outputs.runtime_relevant == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    concurrency:
      # backend はジョブごとの使い捨てで共有状態を持たないため、
      # PRをまたいだ直列化は不要。同じPRの古い実行だけをキャンセルする。
      group: e2e-${{ matrix.name }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: public
            # `--` 以降の引数は playwright に位置引数フィルタとして飲まれるため
            # フラグは script 名の直後に付ける
            e2e_command: pnpm run e2e:public --project=chromium --workers=3
            timeout: 10
          - name: authenticated
            e2e_command: pnpm run e2e:smoke --project=chromium --grep-invert @public --workers=1
            timeout: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # merge commit ではなく、PR で push された head commit を検証する。
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve E2E Clerk user identifier
        env:
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}
        run: node scripts/resolve-e2e-clerk-user-id.mjs

      - name: Resolve Convex version
        id: convex-version
        run: echo "version=$(node -p "require('convex/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Convex backend binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          # anonymous backend の実行binaryは ~/.cache/convex に置かれる。
          # convex のバージョン（lockfile差分）が変わったときだけ再取得する。
          path: ~/.cache/convex
          key: convex-${{ steps.convex-version.outputs.version }}-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          # @playwright/test のバージョンが変わったときのみ再ダウンロード
          key: playwright-chromium-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Playwright browsers (Chromium only)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium --with-deps

      - name: Install Playwright system dependencies (cache hit時)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # PR HEAD の Convex関数を匿名使い捨てbackendへpushし、env 同期・
      # VITE_CONVEX_URL / VITE_CONVEX_SITE_URL / E2E_CLEANUP_SECRET の注入・
      # 終了処理までを start-ci-convex.mjs が一括で担う。
      - name: Run E2E tests on isolated backend
        run: node scripts/start-ci-convex.mjs --run "${{ matrix.e2e_command }}" --timeout 180
        env:
          # Clerk Testing Token 取得用
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          # E2E テストユーザー認証情報（ログ出力禁止）
          E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}
          E2E_CLERK_USER_PASSWORD: ${{ secrets.E2E_CLERK_USER_PASSWORD }}
          # authenticated smoke だけ管理者通知設定fixtureを有効化する。
          E2E_SYSTEM_ADMIN_MEMBERSHIP_FIXTURE: ${{ matrix.name == 'authenticated' }}

      # 失敗時のみ artifact を保存（認証情報が含まれる可能性があるため短期保存）
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-${{ github.run_id }}-${{ matrix.name }}
          path: |
            playwright-report/
            test-results/
          # 1日で削除（認証情報が含まれる可能性があるため最短期間）
          retention-days: 1
