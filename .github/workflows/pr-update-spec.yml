name: PR update spec

# preview 向け PR の本文に記入された suzumemo-update ブロックを検証する。
# 本文編集(edited)でも再評価される。main 向け統合PRは対象外(branches: preview のみ)。
# bot作成PR(dependabot等)は更新履歴ブロックがない場合のみスクリプト側でスキップする。

on:
  pull_request:
    branches:
      - preview
    types:
      - opened
      - edited
      - reopened
      - ready_for_review
      - synchronize

permissions:
  contents: read

jobs:
  check:
    name: Validate update spec
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate suzumemo-update spec
        run: pnpm exec tsx scripts/check-pr-product-update.ts
