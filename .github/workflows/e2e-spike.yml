name: E2E spike (isolated Convex backend)

# 検証用 workflow。Issue #956 Step 0（S1〜S8の確認）専用。
# マージ前に必ず削除すること（AC10）。
on:
  push:
    branches:
      - devin/20261007-e2e-isolated-backend
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Spike - anonymous local Convex backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Convex backend binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/convex
          key: convex-backend-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: S1/S2/S3/S5/S7 - start anonymous backend and probe
        id: probe
        env:
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
        run: |
          START=$(date +%s)
          node scripts/start-ci-convex.mjs --probe --timeout 180
          echo "probe_seconds=$(( $(date +%s) - START ))" >> "$GITHUB_OUTPUT"

      - name: Resolve E2E Clerk user identifier
        env:
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}
        run: node scripts/resolve-e2e-clerk-user-id.mjs

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Playwright browsers (Chromium only)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium --with-deps

      - name: Install Playwright system dependencies (cache hit時)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # S4: Clerk認証が通るか / S6: 安定して2回通るか（1回目）
      - name: S4/S6 - authenticated spec on isolated backend (run 1)
        env:
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}
          E2E_CLERK_USER_PASSWORD: ${{ secrets.E2E_CLERK_USER_PASSWORD }}
        run: node scripts/start-ci-convex.mjs --run "playwright test e2e/auth.spec.ts e2e/public-pages.spec.ts --project=chromium --workers=1" --timeout 180

      # S6: 2回目。backend が毎回まっさらな使い捨てであることも確認できる。
      - name: S6 - authenticated spec on isolated backend (run 2)
        env:
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}
          E2E_CLERK_USER_PASSWORD: ${{ secrets.E2E_CLERK_USER_PASSWORD }}
        run: node scripts/start-ci-convex.mjs --run "playwright test e2e/auth.spec.ts e2e/public-pages.spec.ts --project=chromium --workers=1" --timeout 180

      - name: Spike summary
        if: always()
        env:
          PROBE_SECONDS: ${{ steps.probe.outputs.probe_seconds }}
        run: |
          {
            echo "### Spike S1-S7"
            printf '%s\n' "- backend start + push + probe: \`${PROBE_SECONDS:-n/a}s\`"
          } >> "$GITHUB_STEP_SUMMARY"
