name: Production Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_ref:
        description: "PREVIEW verified repository ref. Allowed: main or release/*"
        required: true
        default: "main"
      preview_confirmed:
        description: "Confirm that the same ref was verified in PREVIEW"
        required: true
        type: boolean
      db_schema_change_check:
        description: "DB/schema review result"
        required: true
        type: choice
        options:
          - no_db_or_schema_change
          - reviewed_forward_fix_plan
      release_note:
        description: "Short release note or PREVIEW evidence URL"
        required: true

run-name: >-
  Production Release
  ${{ github.event_name == 'push' && format('from main@{0}', github.sha) || format('from {0}', inputs.source_ref) }}

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  preflight:
    name: Production preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      published_at: ${{ steps.version.outputs.published_at }}
    env:
      RELEASE_MODE: ${{ github.event_name == 'push' && 'main_push' || 'manual' }}
      SOURCE_REF: ${{ github.event_name == 'push' && github.sha || inputs.source_ref }}
      PREVIEW_CONFIRMED: ${{ github.event_name == 'push' && 'true' || inputs.preview_confirmed }}
      DB_SCHEMA_CHANGE_CHECK: ${{ github.event_name == 'push' && 'main_push_with_production_approval' || inputs.db_schema_change_check }}
      RELEASE_NOTE: ${{ github.event_name == 'push' && format('main merge production release {0}', github.sha) || inputs.release_note }}
    steps:
      - name: Validate release inputs
        run: |
          if [ "$RELEASE_MODE" = "manual" ]; then
            case "$SOURCE_REF" in
              main|release/*) ;;
              *)
                echo "::error::source_ref must be main or release/* for manual Production releases."
                exit 1
                ;;
            esac
          else
            if [ "$GITHUB_REF_NAME" != "main" ]; then
              echo "::error::automatic Production releases only run from main."
              exit 1
            fi
          fi

          if [ "$PREVIEW_CONFIRMED" != "true" ]; then
            echo "::error::preview_confirmed must be true before Production release."
            exit 1
          fi

          case "$DB_SCHEMA_CHANGE_CHECK" in
            no_db_or_schema_change|reviewed_forward_fix_plan|main_push_with_production_approval) ;;
            *)
              echo "::error::db_schema_change_check must be selected."
              exit 1
              ;;
          esac

          if [ -z "$RELEASE_NOTE" ]; then
            echo "::error::release_note must describe PREVIEW evidence or release intent."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set APP_VERSION and PUBLISHED_AT
        id: version
        run: |
          RELEASE_DATE="$(TZ=Asia/Tokyo date +%Y.%m.%d)"
          PUBLISHED_AT="$(TZ=Asia/Tokyo date +%Y-%m-%d)"
          APP_VERSION="${RELEASE_DATE}-${GITHUB_RUN_NUMBER}"
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "published_at=${PUBLISHED_AT}" >> "$GITHUB_OUTPUT"

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Test
        run: pnpm test --run

      # 承認待ちの時点で掲載予定の内容と元PRの対応をsummaryへ出力し、成果物はartifactでproduction jobへ受け渡す。
      - name: Generate product updates
        run: pnpm exec tsx scripts/generate-product-updates.ts
        env:
          APP_VERSION: ${{ steps.version.outputs.app_version }}
          PUBLISHED_AT: ${{ steps.version.outputs.published_at }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_REF: ${{ env.SOURCE_REF }}

      - name: Build
        run: pnpm run build

      - name: Upload product updates artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: product-updates
          retention-days: 1
          if-no-files-found: error
          # .tmp は hidden dir のため既定では除外される。current-release.json を含めるには必須。
          include-hidden-files: true
          path: |
            src/generated/product-updates.json
            .tmp/product-updates.current-release.json

      - name: Write preflight summary
        run: |
          {
            echo "## Production preflight"
            echo
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Source ref | \`$SOURCE_REF\` |"
            echo "| Release mode | \`$RELEASE_MODE\` |"
            echo "| PREVIEW confirmed | \`$PREVIEW_CONFIRMED\` |"
            echo "| DB/schema check | \`$DB_SCHEMA_CHANGE_CHECK\` |"
            echo "| Release note | $RELEASE_NOTE |"
          } >> "$GITHUB_STEP_SUMMARY"

  release-candidate:
    name: Vercel release candidate E2E
    runs-on: ubuntu-latest
    needs: preflight
    environment: Preview
    concurrency:
      group: preview-staging-deploy
      cancel-in-progress: false
    timeout-minutes: 40
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      SOURCE_REF: ${{ github.event_name == 'push' && github.sha || inputs.source_ref }}
    steps:
      - name: Validate release candidate configuration
        env:
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}
          E2E_CLEANUP_SECRET: ${{ secrets.E2E_CLEANUP_SECRET }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          VITE_CONVEX_SITE_URL: ${{ vars.VITE_CONVEX_SITE_URL }}
        run: |
          missing=()
          [ -n "$VERCEL_TOKEN" ] || missing+=("secrets.VERCEL_TOKEN")
          [ -n "$VERCEL_ORG_ID" ] || missing+=("vars.VERCEL_ORG_ID")
          [ -n "$VERCEL_PROJECT_ID" ] || missing+=("vars.VERCEL_PROJECT_ID")
          [ -n "$CONVEX_DEPLOY_KEY" ] || missing+=("secrets.CONVEX_DEPLOY_KEY")
          [ -n "$CLERK_PUBLISHABLE_KEY" ] || missing+=("secrets.CLERK_PUBLISHABLE_KEY")
          [ -n "$CLERK_SECRET_KEY" ] || missing+=("secrets.CLERK_SECRET_KEY")
          [ -n "$E2E_CLERK_USER_EMAIL" ] || missing+=("secrets.E2E_CLERK_USER_EMAIL")
          [ -n "$E2E_CLEANUP_SECRET" ] || missing+=("secrets.E2E_CLEANUP_SECRET")
          [ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ] || missing+=("secrets.VERCEL_AUTOMATION_BYPASS_SECRET")
          [ -n "$VITE_CONVEX_SITE_URL" ] || missing+=("vars.VITE_CONVEX_SITE_URL")

          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::Missing required release candidate configuration: %s\n' "${missing[*]}"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_REF }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve E2E Clerk user identifier
        env:
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}
        run: node scripts/resolve-e2e-clerk-user-id.mjs

      - name: Configure release candidate Convex security environment
        env:
          E2E_CLEANUP_SECRET: ${{ secrets.E2E_CLEANUP_SECRET }}
        run: |
          pnpm exec convex env set APP_ENV development
          pnpm exec convex env set RECEIPT_IMAGE_EXTRACTOR_MODE mock
          pnpm exec convex env set E2E_CLERK_USER_ID "$E2E_CLERK_USER_ID"
          pnpm exec convex env set E2E_CLEANUP_SECRET "$E2E_CLEANUP_SECRET"

      - name: Build Convex staging and Vercel release candidate
        run: |
          export VITE_ENABLE_E2E_ROUTES=1
          pnpm exec convex deploy \
            --cmd-url-env-var-name VITE_CONVEX_URL \
            --message "release candidate ${GITHUB_SHA}" \
            --cmd 'pnpm exec vercel build --yes --target=preview --token "$VERCEL_TOKEN"'

      - name: Deploy Vercel release candidate
        id: vercel
        run: |
          deployment_url="$(pnpm exec vercel deploy --prebuilt --archive=tgz --target=preview --token "$VERCEL_TOKEN")"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Playwright browsers (Chromium only)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium --with-deps

      - name: Install Playwright system dependencies (cache hit時)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Run Vercel release candidate smoke E2E
        run: pnpm run e2e:smoke -- --project=chromium
        env:
          E2E_BASE_URL: ${{ steps.vercel.outputs.url }}
          PLAYWRIGHT_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}
          E2E_CLERK_USER_PASSWORD: ${{ secrets.E2E_CLERK_USER_PASSWORD }}
          VITE_CONVEX_SITE_URL: ${{ vars.VITE_CONVEX_SITE_URL }}
          E2E_CLEANUP_SECRET: ${{ secrets.E2E_CLEANUP_SECRET }}

      - name: Write release candidate summary
        env:
          VERCEL_RELEASE_CANDIDATE_URL: ${{ steps.vercel.outputs.url }}
        run: |
          {
            echo "## Vercel release candidate E2E"
            echo
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Source ref | \`$SOURCE_REF\` |"
            echo "| Convex deployment | \`staging\` |"
            echo "| Vercel release candidate | $VERCEL_RELEASE_CANDIDATE_URL |"
            echo "| Smoke E2E | \`success\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: [release-candidate, preflight]
    environment: production
    permissions:
      contents: write
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      PRODUCTION_SMOKE_URL: ${{ vars.PRODUCTION_SMOKE_URL }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      APP_VERSION: ${{ needs.preflight.outputs.app_version }}
      PUBLISHED_AT: ${{ needs.preflight.outputs.published_at }}
      VITE_APP_VERSION: ${{ needs.preflight.outputs.app_version }}
      BASE_REF: ${{ github.event_name == 'push' && 'main' || inputs.source_ref }}
      RELEASE_MODE: ${{ github.event_name == 'push' && 'main_push' || 'manual' }}
      SOURCE_REF: ${{ github.event_name == 'push' && github.sha || inputs.source_ref }}
      DB_SCHEMA_CHANGE_CHECK: ${{ github.event_name == 'push' && 'main_push_with_production_approval' || inputs.db_schema_change_check }}
      RELEASE_NOTE: ${{ github.event_name == 'push' && format('main merge production release {0}', github.sha) || inputs.release_note }}
    steps:
      - name: Validate production configuration
        run: |
          missing=()
          [ -n "$VERCEL_TOKEN" ] || missing+=("secrets.VERCEL_TOKEN")
          [ -n "$VERCEL_ORG_ID" ] || missing+=("vars.VERCEL_ORG_ID")
          [ -n "$VERCEL_PROJECT_ID" ] || missing+=("vars.VERCEL_PROJECT_ID")
          [ -n "$CONVEX_DEPLOY_KEY" ] || missing+=("secrets.CONVEX_DEPLOY_KEY")

          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::Missing required Production configuration: %s\n' "${missing[*]}"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_REF }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enforce production Convex environment
        run: pnpm exec convex env set APP_ENV production

      - name: Download product updates artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: product-updates
          path: .

      - name: Check release tag idempotency
        id: idempotency
        run: |
          tag="app-v${APP_VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists. Verifying asset contents..."
            mkdir -p .tmp/existing
            gh release download "$tag" --pattern "product-updates.json" --dir .tmp/existing
            if ! diff -q .tmp/existing/product-updates.json .tmp/product-updates.current-release.json >/dev/null; then
              echo "::error::Release $tag exists with a different product-updates.json"
              diff .tmp/existing/product-updates.json .tmp/product-updates.current-release.json || true
              exit 1
            fi
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $tag exists with identical product-updates.json"
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy Convex Production
        run: |
          pnpm exec convex deploy \
            --cmd-url-env-var-name VITE_CONVEX_URL \
            --cmd 'pnpm exec vercel build --yes --prod --token "$VERCEL_TOKEN"'

      - name: Deploy Vercel Production
        id: vercel
        run: |
          deployment_url="$(pnpm exec vercel deploy --prebuilt --archive=tgz --prod --token "$VERCEL_TOKEN")"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: PROD smoke checklist
        id: smoke
        env:
          VERCEL_DEPLOYMENT_URL: ${{ steps.vercel.outputs.url }}
        run: |
          smoke_target="${PRODUCTION_SMOKE_URL:-$VERCEL_DEPLOYMENT_URL}"
          curl --fail --show-error --location --max-time 30 \
            --header "Cache-Control: no-cache" \
            "$smoke_target" > /tmp/prod-smoke.html
          byte_count="$(wc -c < /tmp/prod-smoke.html | tr -d ' ')"
          if [ "$byte_count" -le 0 ]; then
            echo "::error::PROD smoke target returned an empty response."
            exit 1
          fi

          expected_title="$(sed -n 's:.*<title>\(.*\)</title>.*:\1:p' index.html | head -n 1)"
          deployed_title="$(sed -n 's:.*<title>\(.*\)</title>.*:\1:p' /tmp/prod-smoke.html | head -n 1)"
          if [ -z "$expected_title" ] || [ "$deployed_title" != "$expected_title" ]; then
            echo "::error::PROD title mismatch. expected='$expected_title' actual='$deployed_title'"
            exit 1
          fi

          expected_app_version="${APP_VERSION}"
          deployed_app_version="$(sed -n 's:.*<meta name="app-version" content="\([^"]*\)".*:\1:p' /tmp/prod-smoke.html | head -n 1)"
          if [ -z "$expected_app_version" ] || [ "$deployed_app_version" != "$expected_app_version" ]; then
            echo "::error::PROD app version mismatch. expected='$expected_app_version' actual='$deployed_app_version'"
            exit 1
          fi

          echo "target=$smoke_target" >> "$GITHUB_OUTPUT"
          echo "bytes=$byte_count" >> "$GITHUB_OUTPUT"
          echo "title=$deployed_title" >> "$GITHUB_OUTPUT"
          echo "app_version=$deployed_app_version" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.idempotency.outputs.release_exists != 'true'
        run: |
          printf '%s\n' "$RELEASE_NOTE" > /tmp/release-notes.md
          cp .tmp/product-updates.current-release.json .tmp/product-updates.json
          gh release create "app-v${APP_VERSION}" \
            --title "Suzumemo ${APP_VERSION}" \
            --target "${SOURCE_REF}" \
            --notes-file /tmp/release-notes.md \
            .tmp/product-updates.json

      - name: Write release summary
        env:
          VERCEL_PRODUCTION_URL: ${{ steps.vercel.outputs.url }}
          PROD_SMOKE_TARGET: ${{ steps.smoke.outputs.target }}
          PROD_SMOKE_BYTES: ${{ steps.smoke.outputs.bytes }}
          PROD_TITLE: ${{ steps.smoke.outputs.title }}
          PROD_APP_VERSION: ${{ steps.smoke.outputs.app_version }}
        run: |
          {
            echo "## Production release"
            echo
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Source ref | \`$SOURCE_REF\` |"
            echo "| Release mode | \`$RELEASE_MODE\` |"
            echo "| DB/schema check | \`$DB_SCHEMA_CHANGE_CHECK\` |"
            echo "| App version | \`$APP_VERSION\` |"
            echo "| PROD app version | \`$PROD_APP_VERSION\` |"
            echo "| Vercel Production URL | $VERCEL_PRODUCTION_URL |"
            echo "| PROD smoke target | $PROD_SMOKE_TARGET |"
            echo "| PROD smoke response bytes | $PROD_SMOKE_BYTES |"
            echo "| PROD title | $PROD_TITLE |"
            echo "| Product updates | ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/app-v${APP_VERSION}#product-updates.json |"
            echo "| Release note | $RELEASE_NOTE |"
            echo
            echo "Convex Production was deployed before Vercel Production. Treat follow-up fixes as forward-fix releases."
          } >> "$GITHUB_STEP_SUMMARY"
