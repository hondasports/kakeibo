version: 13
name: suzumemo-agent-loop
entrypoint: AGENTS.md
runtime: scripts/task-loop.mjs
# このファイルは実装契約。現在CLIはこのYAMLを解釈せず、JSのvalidatorが条件を実行する。
# 変更時はruntimeとテストを同じPRで更新し、未実装条件を保証済みと書かない。
execution:
  default_order: [contract, implementation, verification, self_review, delivery]
  default_agent: single
  delegation: explicit_user_request_only
  material_questions: block_dependent_implementation_only
  default_delivery_target: merge_ready
  delivery_targets: [local_verified, pr_created, merge_ready]
  explicit_user_stop: overrides_default
commands:
  init: workspace_preflight_and_task_binding
  contract: validate_and_record_contract_revision_with_reason
  check: execute_registered_argv_and_record_exit_log_duration
  review: record_explicit_self_review_for_current_evidence_key
  finding: update_stable_id_and_preserve_history
  status: compute_current_blockers_without_mutation
  finish: require_current_proof_and_observe_delivery_target
proof:
  identity:
    [tracked_and_nonignored_untracked_file_content, contract, node_version, platform, architecture]
  environment: explicit_nonsecret_contract_environment_revision
  invalidation: any_identity_change
  during_check_content_change: fail
  check_success: latest_run_for_current_key_has_exit_zero
  review: current_key_self_review_pass
  manual: required_manual_results_have_pass_and_nonempty_evidence
  findings: no_open_findings
  contract: no_unresolved_material_questions
  history: local_atomic_state_updates_not_tamperproof
pr:
  adapter: github_cli_read_only
  identity: [open_pr, current_commit, current_branch, expected_base, clean_worktree]
  pr_created: identity_only_ci_wait_not_required
  merge_ready:
    [
      identity,
      non_draft,
      mergeable,
      clean_merge_state,
      no_changes_requested_or_review_required,
      all_reported_checks_success_neutral_or_skipped,
    ]
  limitation: no_review_comment_collection_adapter_use_manual_control_for_actionable_thread_coverage
controls:
  source: task_contract_controls
  selection: concrete_auth_data_financial_destructive_external_change
  lowering: explicit_contract_revision_reason_and_review
  manual_approval: human_judgment_record_never_cli_authorization
learning:
  completion_gate: false
  trigger: repeated_failure_or_clear_enforcement_gap_or_user_request
  findings: all_actionable_findings_require_disposition_independent_of_learning
legacy:
  check_loop_evidence: retained_for_legacy_consumers_not_v13_completion
  learning_records: historical_evidence_not_current_instructions
