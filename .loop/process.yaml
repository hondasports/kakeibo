version: 14
name: suzumemo-agent-loop
entrypoint: AGENTS.md
runtime: scripts/task-loop.mjs
# このファイルは実装契約。現在CLIはこのYAMLを解釈せず、JSのvalidatorが条件を実行する。
# 変更時はruntimeとテストを同じPRで更新し、未実装条件を保証済みと書かない。
execution:
  default_order: [contract, implementation, verification, assessment, self_review, delivery]
  default_agent: single
  delegation: explicit_user_request_only
  material_questions: block_dependent_implementation_only
  default_delivery_target: merge_ready
  delivery_targets: [local_verified, pr_created, merge_ready]
  explicit_user_stop: overrides_default
commands:
  guide: read_only_topic_scoped_skill_and_input_guidance
  assess: validate_risk_calculate_floor_and_record_current_assessment
  init: workspace_preflight_and_task_binding
  contract: validate_and_record_contract_revision_with_reason
  check: execute_registered_argv_and_record_exit_log_duration
  review: record_explicit_self_review_for_current_evidence_key
  finding: update_stable_id_and_preserve_history
  status: compute_current_blockers_and_next_action_without_mutation
  finish: require_current_proof_and_observe_delivery_target
proof:
  identity:
    [
      loop_version,
      tracked_and_nonignored_untracked_file_content,
      contract,
      node_version,
      platform,
      architecture,
    ]
  environment: explicit_nonsecret_contract_environment_revision
  invalidation: any_identity_change
  during_check_content_change: fail
  check_success: latest_run_for_current_key_has_exit_zero
  assessment: current_key_risk_assessment_with_calculated_tier
  review: current_key_self_review_pass_bound_to_latest_assessment
  manual: required_manual_results_have_pass_and_nonempty_evidence
  findings: no_open_findings
  task_state: reject_tracked_or_staged_state_paths
  contract: no_unresolved_material_questions
  history: local_atomic_state_updates_not_tamperproof
pr:
  adapter: github_cli_read_only
  identity: [open_pr, current_commit, current_branch, expected_base, clean_worktree]
  pr_created: identity_only_ci_wait_not_required
  merge_ready:
    [
      identity,
      non_draft,
      mergeable,
      clean_merge_state,
      no_changes_requested_or_review_required,
      all_reported_checks_success_neutral_or_skipped,
    ]
  limitation: no_review_comment_collection_adapter_use_manual_control_for_actionable_thread_coverage
controls:
  source: task_contract_controls
  selection: concrete_auth_data_financial_destructive_external_change
  lowering: explicit_contract_revision_reason_and_review
  manual_approval: human_judgment_record_never_cli_authorization
review_depth:
  purpose: decide_self_review_depth_from_actual_diff_immediately_before_review
  assessed_at: review_time_not_contract_time
  canonical_vocabulary: scripts_task_loop_mjs_exposed_by_guide_assessment_mirrored_here
  axes:
    blast_radius: [local, several_surfaces, shared_or_system_wide]
    data_security: [none, indirect, direct_boundary_change]
    reversibility: [easy, procedural_rollback, difficult_or_stateful]
    uncertainty: [known_pattern, some_unknowns, novel_or_impact_unclear]
  floor_triggers:
    [
      authentication_or_authorization,
      schema_or_migration,
      data_deletion_or_retention,
      complex_state_transition_or_orchestration_port,
      cross_domain_shared_caller_change,
      external_service_write_or_webhook,
      destructive_or_irreversible_operation,
    ]
  tiers:
    T1: diff_spot_check_plus_all_checks_passing
    T2: line_level_diff_review_error_order_compatibility_checks_relevant_tests
    T3: base_vs_new_behavior_comparison_or_full_logic_trace_port_adapter_semantics_all_error_paths_shared_callers
  floor_rule: any_floor_trigger_or_extreme_axis_requires_T3_any_middle_axis_requires_T2
  enforcement: assess_validates_floor_review_binds_latest_assessment_not_review_quality
  excluded: [numeric_scores, risk_lifecycle_or_ratchet, mandatory_independent_review_counts]
learning:
  completion_gate: false
  trigger: repeated_failure_or_clear_enforcement_gap_or_user_request
  findings: all_actionable_findings_require_disposition_independent_of_learning

context:
  default_entry: AGENTS.md_then_cli_next_action
  reference_loading: relevant_guide_and_skill_only
  state_migration: preserve_v13_history_invalidate_old_proof_upgrade_on_write
