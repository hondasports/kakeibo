  #   contract_ids: [AC01]
  #   kind: positive | boundary | negative | failure | regression | e2e
  #   method: "test path / command / manual evidence"
  risk:
    initial_level: pending
    level: pending # r0_trivial | r1_low | r2_medium | r3_high | r4_critical
